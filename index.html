<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Shesha Dormilona</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050008;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 4%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            color: #ff69b4;
            text-shadow: 0 0 10px #ff1493, 0 0 25px #ff1493, 0 0 40px #ff1493;
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 1.5px;
            font-weight: bold;
        }
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a001a 0%, #050008 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .heart-btn {
            font-size: 65px;
            color: #ff1493;
            text-shadow: 0 0 20px #ff1493;
            animation: pulse 1.3s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        .text-hint {
            letter-spacing: 4px;
            font-size: 0.85rem;
            margin-top: 20px;
            color: #ffb6c1;
            text-transform: uppercase;
        }
        .sub-hint {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            color: #ffb6c1;
            font-size: 0.8rem;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>

    <!-- Importación de Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Pantalla de inicio -->
    <div id="start-screen" class="start-screen" onclick="startExperience()">
        <div class="heart-btn">♥</div>
        <div class="text-hint">TOCA PARA EMPEZAR</div>
    </div>

    <!-- Título superior -->
    <div id="ui">
        <h1>Para mi shesha dormilona ♥</h1>
    </div>

    <div class="sub-hint">Toca o arrastra para explorar</div>

    <div id="container"></div>

    <script>
        let scene, camera, renderer, controls;
        let galaxyGroup;

        // Frases personalizadas
        const phrases = [
            "Te amo yenshi 🦋",
            "Eres la mejor ❤️🦋",
            "Mi reina ❤️🫵🥺",
            "Te amo ❤️🥰",
            "Eres hermosa ❤️🥺",
            "Eres muy especial para mi❤️🫂"
        ];

        function createTextCanvas(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            ctx.font = 'Bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Glow / resplandor
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#ffffff';

            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createHeartMesh() {
            const heartShape = new THREE.Shape();
            const x = 0, y = 0;
            heartShape.moveTo(x + 0.25, y + 0.25);
            heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
            heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
            heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
            heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
            heartShape.bezierCurveTo(x + 0.8, y, x + 0.7, y, x + 0.5, y);
            heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

            const extrudeSettings = {
                depth: 0.2,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: 0.08,
                bevelThickness: 0.08
            };

            const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshPhongMaterial({
                color: 0xff1493,
                emissive: 0xff007f,
                emissiveIntensity: 0.6,
                shininess: 100
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.scale.set(4, 4, 4);
            mesh.rotation.z = Math.PI; // Orientación correcta
            return mesh;
        }

        function init() {
            // Escena y Cámara
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 28);

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('container').appendChild(renderer.domElement);

            // Controles interactivos
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 50;
            controls.minDistance = 10;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff69b4, 2, 50);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // Grupo para la galaxia giratoria
            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            // Corazón 3D central
            const heart = createHeartMesh();
            heart.position.set(0, 2, 0);
            scene.add(heart);

            // Estrellas de fondo
            const starGeo = new THREE.BufferGeometry();
            const starCount = 2500;
            const starPos = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i++) {
                starPos[i] = (Math.random() - 0.5) * 180;
            }

            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({
                color: 0xffb6c1,
                size: 0.4,
                transparent: true,
                opacity: 0.8
            });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // Disco / Anillo espiral de partículas rosas
            const ringParticleCount = 1500;
            const ringGeo = new THREE.BufferGeometry();
            const ringPos = new Float32Array(ringParticleCount * 3);

            for (let i = 0; i < ringParticleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 6 + Math.random() * 10;
                ringPos[i * 3] = Math.cos(angle) * radius;
                ringPos[i * 3 + 1] = (Math.random() - 0.5) * 1.5;
                ringPos[i * 3 + 2] = Math.sin(angle) * radius;
            }

            ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
            const ringMat = new THREE.PointsMaterial({
                color: 0xff69b4,
                size: 0.35,
                transparent: true,
                opacity: 0.9
            });
            const ringParticles = new THREE.Points(ringGeo, ringMat);
            galaxyGroup.add(ringParticles);

            // Añadir frases flotantes en 3D
            phrases.forEach((phraseText, idx) => {
                const texture = createTextCanvas(phraseText);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(spriteMat);

                const angle = (idx / phrases.length) * Math.PI * 2;
                const radius = 9 + (idx % 2 === 0 ? 1.5 : -1.5);

                sprite.position.x = Math.cos(angle) * radius;
                sprite.position.y = (Math.sin(idx) * 2);
                sprite.position.z = Math.sin(angle) * radius;

                sprite.scale.set(7, 1.75, 1);
                galaxyGroup.add(sprite);
            });

            // Animación
            function animate() {
                requestAnimationFrame(animate);

                // Rotación suave del grupo
                galaxyGroup.rotation.y += 0.003;
                heart.rotation.y += 0.008;

                // Pequeño bamboleo del corazón
                heart.position.y = 2 + Math.sin(Date.now() * 0.002) * 0.3;

                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        function startExperience() {
            const screen = document.getElementById('start-screen');
            screen.style.opacity = '0';
            setTimeout(() => {
                screen.style.display = 'none';
            }, 800);
            init();
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
